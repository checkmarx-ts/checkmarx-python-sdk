openapi: 3.1.0
info:
  description: "AI Supply Results Service REST API"
  title: "AI Supply Results Service"
  version: 1.0.0
paths:
  # Project scan results endpoints

  # Get AI Supply results for a specific scan of a project
  "/scans/{scanId}/results":
    get:
      tags:
        - "Scan Results"
      summary: Get AI Supply result for a specific scan
      description: "Scan ID is a required query param. You can limit results by using pagination and/or setting filters.<br>Note: An AND operator is applied between filters, and an OR operator is applied to multiple values for each filter."
      operationId: GetScanResult
      parameters:
        - $ref: "#/components/parameters/ScanIdParam"
        # filters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/AssetTypeIdsParam"
        - $ref: "#/components/parameters/AssetNamesParam"
        - $ref: "#/components/parameters/ProvidersParam"
        - $ref: "#/components/parameters/VersionParam"
        - $ref: "#/components/parameters/AssetFirstDetectionDateParam"
        - $ref: "#/components/parameters/AssetStatusParam"
        - $ref: "#/components/parameters/EvidenceStatusParam"
        - $ref: "#/components/parameters/PathParam"
        - $ref: "#/components/parameters/RiskSeveritiesParam"
        - $ref: "#/components/parameters/ProjectIdParam"
        # pagination and ordering
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/ScanResultsOrderColumnParam"
        - $ref: "#/components/parameters/ScanResultsOrderDirectionParam"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedScanResultsResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
  # Aggregate scan results for a specific filter set
  "/scans/{scanId}/results/aggregate":
    get:
      tags:
        - "Scan Results"
      summary: "Aggregate scan results groups by specified fields"
      operationId: GetAggregateScanResultsGroups
      parameters:
        - $ref: "#/components/parameters/ScanIdParam"
        # filters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/AssetTypeIdsParam"
        - $ref: "#/components/parameters/AssetNamesParam"
        - $ref: "#/components/parameters/ProvidersParam"
        - $ref: "#/components/parameters/VersionParam"
        - $ref: "#/components/parameters/AssetFirstDetectionDateParam"
        - $ref: "#/components/parameters/AssetStatusParam"
        - $ref: "#/components/parameters/EvidenceStatusParam"
        - $ref: "#/components/parameters/PathParam"
        - $ref: "#/components/parameters/ProjectIdParam"
        # grouping
        - $ref: "#/components/parameters/ResultsGroupByParam"
      responses:
        "200":
          description: Ok
          content:
            application/json; version=1.0:
              schema:
                $ref: "#/components/schemas/ScanResultsGroupsAggregationResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
  # LLM risk details for a specific asset within a scan
  "/scans/{scanId}/assets/{assetId}/risks":
    get:
      tags:
        - "Scan Results"
      summary: Get LLM-assessed risks for a specific asset in a scan
      description: >
        Returns a paginated, filtered list of risk findings for one asset (by discovery asset_id). Filters and pagination are optional query parameters; omitting them returns all risks with default pagination. AND logic is applied between different filter fields; OR logic within each comma-separated field. Data is sourced from the ai-sc-risks service. When projectId is supplied, each risk item is enriched with per-risk triage (state, severity, scope, etc.) from ai-sc-results-triage for that project, asset, and riskId. Triage is always fetched live on each request; only ai-sc-risks payload is cached.

      operationId: GetAssetRisks
      parameters:
        - $ref: "#/components/parameters/ScanIdParam"
        - $ref: "#/components/parameters/AssetIdPathParam"
        - $ref: "#/components/parameters/AssetRisksSeveritiesParam"
        - $ref: "#/components/parameters/AssetRisksNamesParam"
        - $ref: "#/components/parameters/AssetRisksRiskIdsParam"
        - $ref: "#/components/parameters/AssetRisksFilePathParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/AssetRisksOrderColumnParam"
        - $ref: "#/components/parameters/AssetRisksOrderDirectionParam"
        - $ref: "#/components/parameters/ProjectIdParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRisksResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "503":
          description: Upstream risks service temporarily unavailable
          content:
            application/json; version=1.0:
              schema:
                $ref: "#/components/schemas/Error"
  "/scans/{scanId}/results/{id}":
    get:
      tags:
        - "Scan Results"
      summary: Get the full profile of a single result
      description: >
        Returns the identity, source, and detection-context fields for one specific result row (by id — the same DetectionHash-backed value returned as ScanResult.id from GET /scans/{scanId}/results) within a scan, for the UI's asset Details Tab. An asset can have multiple detections/evidence rows (e.g. across files), so the lookup is keyed on the individual result rather than the asset. Fields without an available upstream source yet (e.g. commitSha, publisher, description, consumingClient, referenceType, lastSeen) are omitted from the response until they can be resolved. The response shape is discriminated by assetType..

      operationId: GetAssetDetail
      parameters:
        - $ref: "#/components/parameters/ScanIdParam"
        - $ref: "#/components/parameters/ResultIdPathParam"
        - $ref: "#/components/parameters/ProjectIdParam"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AssetDetailResponse"
                  - $ref: "#/components/schemas/McpAssetDetailResponse"
                  - $ref: "#/components/schemas/SkillAssetDetailResponse"
                discriminator:
                  propertyName: assetType
                  mapping:
                    "MCP Server": "#/components/schemas/McpAssetDetailResponse"
                    "MCP Client": "#/components/schemas/McpAssetDetailResponse"
                    "Skill": "#/components/schemas/SkillAssetDetailResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "503":
          description: Upstream discovery service temporarily unavailable
          content:
            application/json; version=1.0:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    PaginatedScanResultsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScanResult"
          description: list of returned objects
        total:
          type: integer
          description: total
        currentPage:
          type: integer
          description: currentPage
        lastPage:
          type: integer
          description: currentPage
    ScanResult:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for a scan result
        evidenceKey:
          type: string
          description: >
            Stable, content-based evidence identity, passed through unchanged from the upstream engine (Detection.evidence_key). Clients (e.g. mute/snooze) should use this to reference the same logical detection across rescans instead of path/startLine.

        assetType:
          $ref: "#/components/schemas/AssetTypeName"
        assetTypeId:
          $ref: "#/components/schemas/AssetTypeId"
        assetName:
          $ref: "#/components/schemas/AssetName"
        assetId:
          $ref: "#/components/schemas/AssetId"
        provider:
          type: string
        version:
          type: string
        assetFirstDetectionDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/Status"
          description: Evidence triage status mapped for REST.
        snoozeDate:
          type: string
          format: date-time
          description: Evidence snooze end date from triage when projectId is supplied.
        path:
          type: string
        startLine:
          type: integer
          description: Start line number (1-based)
        startColumn:
          type: integer
          description: Start column number (0-based)
        endLine:
          type: integer
          description: End line number (1-based)
        endColumn:
          type: integer
          description: End column number (0-based)
        riskSummary:
          $ref: "#/components/schemas/RiskSummary"
          description: >
            Aggregated risk counts for the asset (shared across all evidence rows with the same assetId). From ai-sc-risks when available; may be updated from triage when risk rows are returned. Omitted when no risk data is available.

        triage:
          $ref: "#/components/schemas/TriageInfo"
          description: >
            Evidence- and asset-level triage from ai-sc-results-triage when projectId is supplied. Evidence triage must use the row id (similarityId). Per-risk triage is not included; use riskSummary for severity rollups. Triage is always fetched live on each request (not cached). Omitted when skipped.

    TriageInfo:
      type: object
      description: Resolved triage state for one scan result row (evidence and asset scope only).
      properties:
        evidence:
          $ref: "#/components/schemas/EvidenceTriageInfo"
        asset:
          $ref: "#/components/schemas/AssetTriageInfo"
    EvidenceTriageInfo:
      type: object
      properties:
        status:
          type: string
        scope:
          type: string
        snoozeEndDate:
          type: string
          format: date-time
    AssetTriageInfo:
      type: object
      properties:
        status:
          type: string
        scope:
          type: string
        snoozeEndDate:
          type: string
          format: date-time
        isSuppressed:
          type: boolean
    RiskSummary:
      type: object
      description: Aggregated risk counts for an asset, keyed by assetId.
      properties:
        assetId:
          type: string
          description: Discovery asset identifier; use as the path segment when calling GetAssetRisks.
        totalRisks:
          type: integer
          format: int32
          description: Total number of risk findings for the asset.
        riskCountBySeverity:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: Count of risks keyed by severity label (e.g. CRITICAL, HIGH).
    AssetName:
      type: string
      description: The asset type display name.
    AssetId:
      type: string
      format: uuid4
      description: The asset ID.
      examples:
        - "123e4567-e89b-12d3-a456-426614174000"
    Status:
      type: string
      enum:
        - Snoozed
        - Muted
        - Monitored
        - Mixed
      description: >
        Evidence triage status mapped for REST.

    AssetTypeId:
      type: string
      format: uuid4
      description: The asset type ID.
      examples:
        - "223e4567-e89b-12d3-a456-426614174001"
    AssetTypeName:
      type: string
      description: >
        The asset type name, passed through unchanged from the upstream discovery engine (models.Detection.AssetType / models.AssetDetail.AssetType).

      enum:
        - AI Model
        - AI SDK
        - AI Library
        - MCP Server
        - MCP Client
        - AI Agent
        - AI Orchestration Framework
        - Skill
    Position:
      type: object
      properties:
        line:
          type: integer
          description: Line number (1-based)
        column:
          type: integer
          description: Column number (0-based)
      description: A position within a source file
    Error:
      type: object
      properties:
        message:
          type: string
    ScanResultsGroupCounter:
      type: object
      properties:
        assetTypeId:
          $ref: "#/components/schemas/AssetTypeId"
        assetType:
          $ref: "#/components/schemas/AssetTypeName"
        assetName:
          $ref: "#/components/schemas/AssetName"
        provider:
          type: string
        version:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        count:
          type: integer
          description: The count for the field value.
    ScanResultsGroupsAggregationResponse:
      type: object
      properties:
        scanGroupsCounter:
          type: array
          description: An array of field counters.
          items:
            $ref: "#/components/schemas/ScanResultsGroupCounter"
    AssetRisksResponse:
      type: object
      properties:
        scanId:
          type: string
          format: uuid4
          description: Scan ID
        assetId:
          type: string
          description: Discovery asset identifier (same as path parameter)
        assetName:
          type: string
          description: Human-readable asset name from the risks service
        assetUrl:
          type: string
          description: Resolved URL for the asset when available
        totalRisks:
          type: integer
          description: Total number of risks matching the applied filters (before pagination)
        currentPage:
          type: integer
          description: The current 1-based page number
        lastPage:
          type: integer
          description: The last available page number given the current limit
        riskCountBySeverity:
          type: object
          additionalProperties:
            type: integer
          description: Risk count keyed by severity label computed over the filtered set
          examples:
            - HIGH: 2
              CRITICAL: 1
        triage:
          type: object
          description: >
            Asset-level triage from ai-sc-results-triage when projectId is supplied (same triage.asset shape as scan results). Omitted when projectId is missing or triage lookup fails. Not cached.

          properties:
            asset:
              $ref: "#/components/schemas/AssetTriageInfo"
        risks:
          type: array
          description: The page of risk items matching the applied filters
          items:
            $ref: "#/components/schemas/RiskItem"
    AssetDetailResponse:
      type: object
      description: >
        Common identity, source, and detection-context fields for one result row (see CX-2024 REQ-12). Fields marked nullable have no upstream source yet and are omitted until resolvable. Returned as-is for asset types with no type-specific fields.

      properties:
        id:
          type: string
          description: >
            DetectionHash-backed identifier for the specific result this detail was resolved for (same value as the path parameter, and as ScanResult.id from GET /scans/{scanId}/results).

        assetId:
          $ref: "#/components/schemas/AssetId"
        assetName:
          $ref: "#/components/schemas/AssetName"
        assetType:
          $ref: "#/components/schemas/AssetTypeName"
        version:
          type: string
          nullable: true
          description: Pinned version, or resolved commit SHA when no version is pinned.
        commitSha:
          type: string
          nullable: true
          description: Not yet resolvable upstream.
        distributionChannel:
          type: string
          nullable: true
          description: >
            npm, PyPI, Docker, GitHub, remote, or SDK. For MCP findings, falls back to metadata derived from the engine when not directly available.

        provider:
          type: string
          nullable: true
          description: Publisher/maker of the asset.
        license:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
          description: >
            Resolved web location the asset is fetched from. For a remote MCP server this is its connection endpoint; for a stdio-launched one, falls back to its package/image/repo location when no endpoint applies.

        packageCoordinate:
          type: string
          nullable: true
          description: e.g. "@modelcontextprotocol/server-filesystem" or a Docker image coordinate.
        publisher:
          type: string
          nullable: true
          description: Author/org. Not yet resolvable upstream.
        description:
          type: string
          nullable: true
          description: Short summary from registry/package metadata. Not yet resolvable upstream.
        sourceFile:
          type: string
          nullable: true
          description: Where in the scanned code the reference was found.
        consumingClient:
          type: string
          nullable: true
          description: e.g. Claude Desktop, OpenAI Agents SDK. Not yet resolvable upstream.
        referenceType:
          type: string
          nullable: true
          description: >
            Client config, dependency manifest, remote endpoint, or SDK usage. Not yet resolvable upstream.

        projectId:
          type: string
          nullable: true
          description: Echoed back from the request; not currently stored per-detection.
        firstDetection:
          type: string
          format: date-time
          nullable: true
        lastSeen:
          type: string
          format: date-time
          nullable: true
          description: Not yet resolvable upstream.
    McpAssetDetailResponse:
      description: >
        AssetDetailResponse plus MCP-specific fields, returned for MCP server/client findings (assetType "MCP Server" or "MCP Client"). Currently sourced from engine metadata passthrough, when the AISupplyChainEngineMCPAnalyzerEnabled feature flag is on upstream.

      allOf:
        - $ref: "#/components/schemas/AssetDetailResponse"
        - type: object
          properties:
            transport:
              type: string
              nullable: true
              description: stdio, SSE, or Streamable HTTP.
            sourceType:
              type: string
              nullable: true
              description: >
                Engine-internal category for how the asset was resolved (e.g. package/docker/url). No CX-2024 field of its own, exposed as engine metadata passthrough.

            mcpName:
              type: string
              nullable: true
              description: >
                The MCP server/client's own self-reported name, resolved from its constructor call (e.g. Server(name="my-server")). MCP SDK-usage findings only; assetName is already derived from this upstream, so the two may differ (a mismatch is itself a signal).

            mcpVersion:
              type: string
              nullable: true
              description: >
                The MCP server/client's own self-reported version. MCP SDK-usage findings only; version is already derived from this upstream, so the two may differ.

    SkillAssetDetailResponse:
      description: >
        AssetDetailResponse plus Skill-specific fields, returned for Skill findings (assetType "Skill"). Currently sourced from engine-reported skill frontmatter metadata (raw string values, e.g. "true"/"false" for the boolean-shaped fields).

      allOf:
        - $ref: "#/components/schemas/AssetDetailResponse"
        - type: object
          properties:
            allowedTools:
              type: string
              nullable: true
              description: Comma-separated list of tools the skill is allowed to invoke.
            disableModelInvocation:
              type: string
              nullable: true
            userInvocable:
              type: string
              nullable: true
            frontmatterDescription:
              type: string
              nullable: true
            frontmatterVersion:
              type: string
              nullable: true
            lockFile:
              type: string
              nullable: true
              description: >
                Lockfile that claimed the skill: "microsoft/apm" (apm.lock.yaml) or "vercel-labs/skills" (skills-lock.json). Absent when no lockfile matched.

    RiskItem:
      type: object
      properties:
        riskId:
          type: string
          deprecated: true
          description: >
            Scan-local identifier for the risk finding. Deprecated in favor of similarityId, which is stable across rescans; riskId is planned for removal in Q1.

        similarityId:
          type: string
          description: Stable identifier for the risk finding that stays consistent across rescans
        name:
          type: string
          description: Technical rule identifier (e.g. pickle.dangerous_opcodes)
        displayName:
          type: string
          description: Human-readable rule name for UI display
        severity:
          type: string
          description: Severity label (e.g. HIGH, MEDIUM, LOW, CRITICAL)
        description:
          type: string
        locations:
          type: array
          description: All file locations where this risk was detected
          items:
            $ref: "#/components/schemas/RiskLocation"
        remediation:
          type: string
        triage:
          $ref: "#/components/schemas/RiskTriageInfo"
          description: >
            Per-risk triage from ai-sc-results-triage when projectId is supplied. Omitted when projectId is missing or triage lookup fails.

    RiskTriageInfo:
      type: object
      description: Resolved triage state for one risk within a project and asset.
      properties:
        riskId:
          type: string
        state:
          type: string
        customStateId:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
        scope:
          type: string
    RiskLocation:
      type: object
      properties:
        filePath:
          type: string
          description: Path of the file where the risk was found
        details:
          $ref: "#/components/schemas/RiskDetails"
    RiskDetails:
      type: object
      properties:
        line:
          type: integer
          description: Line number where the risk was detected
        sink:
          type: string
        source:
          type: string
        snippet:
          type: string
        extra:
          type: object
          additionalProperties:
            type: string
          description: Additional key-value context from the risk engine
  responses:
    "401":
      description: "Unauthorized, Access token is missing or invalid"
    "403":
      description: "Forbidden"
    "500":
      description: "Internal server error"
    "404":
      description: Not Found
      content:
        application/json; version=1.0:
          schema:
            $ref: "#/components/schemas/Error"
    "400":
      description: Bad Request
      content:
        application/json; version=1.0:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    ProvidersParam:
      name: providers
      in: query
      description: Comma-separated list of providers to filter by
      required: false
      schema:
        type: string
        examples:
          - "openai,gemini,anthropic"
    AssetNamesParam:
      name: asset-names
      in: query
      description: Comma-separated list of asset names to filter by
      required: false
      schema:
        type: string
        examples:
          - "gpt-4,claude-3"
    AssetTypeIdsParam:
      name: asset-type-ids
      in: query
      description: Comma-separated list of asset type IDs to filter by
      required: false
      schema:
        $ref: "#/components/schemas/AssetTypeId"
    SearchParam:
      name: search
      in: query
      required: false
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      description: limit the number of results
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    OffsetParam:
      name: offset
      in: query
      description: 1-based page number (page 1 returns the first limit results, page 2 the next, etc.)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    ScanIdParam:
      name: scanId
      in: path
      description: Scan ID
      required: true
      schema:
        type: string
        format: uuid4
    AssetIdPathParam:
      name: assetId
      in: path
      description: >
        Discovery asset_id for the asset within the scan (must match asset_id stored with LLM risks). URL-encode reserved characters if present (e.g. %2F for a slash).

      required: true
      schema:
        type: string
    ResultIdPathParam:
      name: id
      in: path
      description: >
        DetectionHash-backed result identifier — the same value returned as ScanResult.id by GET /scans/{scanId}/results. An opaque identity with no reserved URL characters, unlike assetId.

      required: true
      schema:
        type: string
    AssetRisksSeveritiesParam:
      name: severities
      in: query
      required: false
      description: >
        Comma-separated severity labels to include (case-insensitive). Risks whose severity is not in this list are excluded.

      schema:
        type: string
        examples:
          - "CRITICAL,HIGH"
    AssetRisksNamesParam:
      name: names
      in: query
      required: false
      description: >
        Comma-separated exact risk names to include (case-insensitive).

      schema:
        type: string
        examples:
          - "SQL Injection,Path Traversal"
    AssetRisksRiskIdsParam:
      name: riskIds
      in: query
      required: false
      description: Comma-separated risk IDs to include.
      schema:
        type: string
        examples:
          - "r1,r2,r3"
    AssetRisksFilePathParam:
      name: filePath
      in: query
      required: false
      description: >
        Substring match applied to the file path of any risk location. Risks with no matching location are excluded.

      schema:
        type: string
        examples:
          - "src/auth"
    AssetRisksOrderColumnParam:
      name: orderColumn
      in: query
      description: Column to sort results by.
      required: false
      schema:
        type: string
        enum:
          - name
          - severity
          - riskId
        examples:
          - "severity"
    AssetRisksOrderDirectionParam:
      name: orderDirection
      in: query
      description: Sort direction.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        examples:
          - "desc"
    ResultIdParam:
      name: resultId
      in: path
      description: Result ID
      required: true
      schema:
        type: string
        format: uuid4
    ResultsGroupByParam:
      name: groupBy
      in: query
      description: >
        Comma-separated list of fields to group by (1 to 3 fields, no duplicates). Supported values: assetType, assetName, provider. Example: groupBy=assetType,provider

      required: true
      schema:
        type: string
        examples:
          - "assetType,provider"
        enum:
          - assetType
          - assetName
          - provider
          - assetType,provider
          - assetType,assetName
          - provider,assetType
          - provider,assetName
          - assetName,provider
          - assetName,assetType
          - assetType,assetName,provider
          - assetType,provider,assetName
          - provider,assetType,assetName
          - provider,assetName,assetType
          - assetName,provider,assetType
          - assetName,assetType,provider
    ScanResultsOrderColumnParam:
      name: orderColumn
      in: query
      description: Column to sort by
      required: false
      schema:
        type: string
        enum:
          - assetType
          - assetName
          - provider
          - version
          - assetFirstDetectionDate
          - state
          - riskSummary
        default: assetName
    ScanResultsOrderDirectionParam:
      name: orderDirection
      in: query
      description: Sort direction
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
          - ASC
          - DESC
        default: desc
    VersionParam:
      name: version
      in: query
      description: Filter results by version
      required: false
      schema:
        type: string
    AssetFirstDetectionDateParam:
      name: assetFirstDetectionDate
      in: query
      description: Filter results by detection time
      required: false
      schema:
        type: string
        format: date-time
    AssetStatusParam:
      name: asset-status
      in: query
      description: >
        Filter results by asset-level triage status (from ai-sc-results-triage). Requires projectId so triage enrichment runs. Comma-separated values; OR within values, AND with other filters. Case insensitive (e.g. muted, snoozed).

      required: false
      schema:
        type: array
        items:
          type: string
    EvidenceStatusParam:
      name: evidence-status
      in: query
      description: >
        Filter results by evidence-level triage status (triage.evidence.status from ai-sc-results-triage). Requires projectId so triage enrichment runs. Comma-separated values; OR within values, AND with other filters. Case insensitive (e.g. muted, snoozed).

      required: false
      schema:
        type: array
        items:
          type: string
    PathParam:
      name: path
      in: query
      description: Filter results by file location
      required: false
      schema:
        type: string
    RiskSeveritiesParam:
      name: risk-severities
      in: query
      required: false
      schema:
        type: string
      description: "Comma-separated severity labels to filter by (case-insensitive). Only assets that have at least one risk with a matching severity are returned. Supported values: CRITICAL, HIGH, MEDIUM, LOW."
    ProjectIdParam:
      name: projectId
      in: query
      description: >
        Project GUID required to enrich results with triage state from ai-sc-results-triage. When omitted, triage enrichment is skipped.

      required: false
      schema:
        type: string
        format: uuid
  securitySchemes:
    Login:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /spec/cxauth.html
          scopes: {}
servers:
  - url: /api/ai-sc/reader
security:
  - Login: []
