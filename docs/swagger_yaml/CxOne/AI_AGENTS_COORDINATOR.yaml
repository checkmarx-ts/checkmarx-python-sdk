    AutoTriageProjectConfigWriteItem:
      properties:
        feature:
          type: string
          const: auto_triage
          title: Feature
        enabled:
          type: boolean
          title: Enabled
        config:
          $ref: '#/components/schemas/AutoTriageProjectWriteConfigPayload'
      additionalProperties: false
      type: object
      required:
        - feature
        - enabled
      title: AutoTriageProjectConfigWriteItem
    AutoTriageProjectWriteConfigPayload:
      properties:
        branches:
          items:
            type: string
          type: array
          minItems: 1
          title: Branches
        scannerTypes:
          items:
            $ref: '#/components/schemas/ScannerType'
          type: array
          minItems: 1
          title: Scannertypes
        riskStatuses:
          items:
            $ref: '#/components/schemas/RiskStatus'
          type: array
          minItems: 1
          title: Riskstatuses
        severityLevels:
          items:
            $ref: '#/components/schemas/SeverityLevel'
          type: array
          minItems: 1
          title: Severitylevels
      additionalProperties: false
      type: object
      title: AutoTriageProjectWriteConfigPayload
      description: 'Project PUT payload: stricter list and branch validation than read models.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HistoryCounts:
      properties:
        processed:
          anyOf:
            - type: integer
            - type: 'null'
          title: Processed
        succeeded:
          anyOf:
            - type: integer
            - type: 'null'
          title: Succeeded
        failed:
          anyOf:
            - type: integer
            - type: 'null'
          title: Failed
        skipped:
          anyOf:
            - type: integer
            - type: 'null'
          title: Skipped
      type: object
      title: HistoryCounts
    HistoryFieldValuesResponse:
      properties:
        metaData:
          $ref: '#/components/schemas/HistoryListMetaData'
        values:
          items:
            type: string
          type: array
          title: Values
      type: object
      required:
        - metaData
        - values
      title: HistoryFieldValuesResponse
    HistoryFilterField:
      type: string
      enum:
        - projectNames
      title: HistoryFilterField
    HistoryItem:
      properties:
        id:
          type: string
          title: Id
        origin:
          type: string
          title: Origin
        status:
          type: string
          title: Status
        completedAt:
          type: string
          nullable: true
          title: Completedat
        projectName:
          type: string
          nullable: true
          title: Projectname
        scanners:
          items:
            type: string
          type: array
          title: Scanners
        counts:
          anyOf:
            - $ref: '#/components/schemas/HistoryCounts'
            - type: 'null'
        failureReason:
          type: string
          nullable: true
          title: Failurereason
        occurrenceCount:
          type: integer
          title: Occurrencecount
          default: 1
      type: object
      required:
        - id
        - origin
        - status
        - scanners
      title: HistoryItem
