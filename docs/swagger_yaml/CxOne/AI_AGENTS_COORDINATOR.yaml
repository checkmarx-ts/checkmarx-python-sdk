    HistoryListMetaData:
      properties:
        totalResults:
          type: integer
          title: Totalresults
        filteredResults:
          type: integer
          title: Filteredresults
        page:
          type: integer
          title: Page
        pageSize:
          type: integer
          title: Pagesize
      type: object
      required:
        - totalResults
        - filteredResults
        - page
        - pageSize
      title: HistoryListMetaData
      description: Pagination envelope matching platform list style.
    HistoryListResponse:
      properties:
        metaData:
          $ref: '#/components/schemas/HistoryListMetaData'
        history:
          items:
            $ref: '#/components/schemas/HistoryItem'
          type: array
          title: History
      type: object
      required:
        - metaData
        - history
      title: HistoryListResponse
      description: GET /history response envelope.
    ProjectConfigRequest:
      properties:
        configurations:
          items:
            oneOf:
              - $ref: '#/components/schemas/AutoTriageProjectConfigWriteItem'
              - $ref: '#/components/schemas/AutoRemediationProjectConfigWriteItem'
            discriminator:
              propertyName: feature
              mapping:
                auto_remediation: '#/components/schemas/AutoRemediationProjectConfigWriteItem'
                auto_triage: '#/components/schemas/AutoTriageProjectConfigWriteItem'
          type: array
          maxItems: 2
          minItems: 1
          title: Configurations
      additionalProperties: false
      type: object
      required:
        - configurations
      title: ProjectConfigRequest
    ProjectConfigResponse:
      properties:
        scope:
          type: string
          const: project
          title: Scope
          default: project
        projectId:
          type: string
          format: uuid
          title: Projectid
        configurations:
          items:
            oneOf:
              - $ref: '#/components/schemas/AutoTriageProjectConfigItem'
              - $ref: '#/components/schemas/AutoRemediationProjectConfigItem'
            discriminator:
              propertyName: feature
              mapping:
                auto_remediation: '#/components/schemas/AutoRemediationProjectConfigItem'
                auto_triage: '#/components/schemas/AutoTriageProjectConfigItem'
          type: array
          title: Configurations
      type: object
      required:
        - projectId
        - configurations
      title: ProjectConfigResponse
    RiskState:
      type: string
      enum:
        - TO_VERIFY
        - CONFIRMED
        - URGENT
        - PROPOSED_NOT_EXPLOITABLE
        - NOT_EXPLOITABLE
      title: RiskState
      description: Engine-resolved triage verdict (predicate state).
    RiskStatus:
      type: string
      enum:
        - NEW
        - RECURRENT
      title: RiskStatus
    ScannerType:
      type: string
      enum:
        - SAST
        - SCA
      title: ScannerType
    SeverityLevel:
      type: string
      enum:
        - CRITICAL
        - HIGH
        - MEDIUM
        - LOW
      title: SeverityLevel
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  parameters:
    authHeader:
