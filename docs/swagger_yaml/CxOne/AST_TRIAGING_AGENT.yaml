            type: string
          type: array
          title: Thoughts
        conclusion:
          type: string
          title: Conclusion
          default: ''
        usage_locations:
          items:
            type: string
          type: array
          title: Usage Locations
      type: object
      required:
        - task
        - category
        - status
      title: VerificationStepSchema
      description: One verification step from the agent reasoning trace.
    VulnerabilityMetadataSchema:
      properties:
        component:
          type: string
          nullable: true
          title: Component
        version:
          type: string
          nullable: true
          title: Version
        dependency_type:
          type: string
          nullable: true
          title: Dependency Type
      type: object
      title: VulnerabilityMetadataSchema
      description: Metadata about the vulnerable component.
  parameters:
