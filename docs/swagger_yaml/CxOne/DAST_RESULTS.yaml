  "/results/environment/{environment_id}/{scan_id}/alert_level/group":
    get:
      description: Gets grouped alert-level results (counts per tuple of the requested group-by columns)
      operationId: getGroupedAlertLevelResults
      parameters:
        - $ref: '#/components/parameters/environmentIdPath'
        - $ref: '#/components/parameters/scanIdInAlertPath'
        - name: group
          in: query
          description: the columns to group by [status, name, method, severity, url, path, state, compliance, owasp]
          required: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              example: status
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/alertLevelFilter'
      responses:
        '200':
          description: Success
