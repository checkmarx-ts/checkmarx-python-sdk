openapi: 3.0.1
info:
  title: Result Service Frontend API
  description: API for the Result Service Frontend
  version: 1.0.0
tags:
  - name: result-service
paths:
  "/":
    get:
      description: healthCheck API
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                example: "Result-Service V2 V3 MFE Server Working!"
      operationId: healthCheck
  /results/{scan_id}:
    get:
      description: Gets all results with pagination, filtering, sorting and search for a specific scan id
      operationId: getResults
      parameters:
        - name: scan_id
          in: path
          description: The scan id to get results for
          required: true
          schema:
            type: string
            example: "39e776e4-adfb-4fc7-a144-66c7237f5c7a"
        - name: page
          in: query
          description: The page number to get results for
          required: true
          schema:
            type: integer
            example: "1"
        - name: per_page
          in: query
          description: The number of results per page
          required: true
          schema:
            type: integer
            example: "10"
        - name: sort_by
          in: query
          description: An object of key values to sort columns by regular - (method:asc), url encoded - (method%3Aasc)
          required: false
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              example: "method%3Adesc"
        - name: search
          in: query
          description: The search query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          description: columns to filter by and values
          required: false
          schema:
            $ref: '#/components/schemas/ResultsFilter'
        - name: group
          in: query
          description: columns to group by and values
          required: false
          schema:
            type: object
            additionalProperties: false
            properties:
              severity:
                type: string
              name:
                type: string
              method:
                type: string
              status:
                type: string
              state:
                type: string
              url:
                type: string
              path:
                type: string
              owasp:
                type: string
              alert_similarity_id:
                type: string
              correlation_findings:
                type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSummarizedList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  "/results/info/{result_id}/{scan_id}":
    get:
      description: Gets the results info for a specific result id
      operationId: getResultInfo
      parameters:
        - name: result_id
          in: path
          description: The result id to get info for
          required: true
          schema:
            type: string
            example: "79f91fc5-3779-4699-8cd2-9b466e72e799"
        - name: scan_id
          in: path
          description: The scan id to get results for
          required: true
          schema:
            type: string
            example: "a32b6565-67d4-4079-9d0e-97061d3b9f3f"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  "/results/{scan_id}/group":
    get:
      description: Group results by columns
      operationId: getGroups
      parameters:
        - name: scan_id
          in: path
          description: The scan id to group results
          required: true
          schema:
            type: string
            example: "39e776e4-adfb-4fc7-a144-66c7237f5c7a"
        - name: group
          in: query
          description: the columns to group by [status, name, method, severity, url, path]
          required: false
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              example: status
        - name: search
          in: query
          description: The search query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          description: columns to filter by and values
          required: false
          schema:
            $ref: '#/components/schemas/ResultsFilter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  "/results/{scan_id}/environment/{environment_id}/instance/{similarity_id_2}":
    get:
      description: Returns instance findings data (request/response, param, evidence, other info) for a given scan, environment, and instance similarity ID
      operationId: getInstanceFindings
      parameters:
        - name: scan_id
          in: path
          description: The scan id
          required: true
          schema:
            type: string
            format: uuid
            example: "39e776e4-adfb-4fc7-a144-66c7237f5c7a"
        - name: environment_id
          in: path
          description: The environment id
          required: true
          schema:
            type: string
            format: uuid
            example: "c668cda7-ec6a-498c-8660-4b29be557280"
        - name: similarity_id_2
          in: path
          description: The instance similarity ID
          required: true
          schema:
            type: string
            example: "79f91fc5-3779-4699-8cd2-9b466e72e799"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceFindings'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
