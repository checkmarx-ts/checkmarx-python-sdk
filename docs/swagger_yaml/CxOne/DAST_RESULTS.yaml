  "/correlations/{environment_id}/{scan_id}/results/latest":
    get:
      description: Gets the latest code-correlation results for a given alert or instance similarity ID (requires the DAST-code correlation feature flag)
      operationId: getLatestCorrelationResults
      parameters:
        - $ref: '#/components/parameters/environmentIdPath'
        - $ref: '#/components/parameters/scanIdInAlertPath'
        - name: similarity_id
          in: query
          description: The alert or instance similarity ID to get correlation results for
          required: true
          schema:
            type: string
            example: "79f91fc5-3779-4699-8cd2-9b466e72e799"
        - name: type
          in: query
          description: Whether similarity_id refers to an alert or an instance
          required: true
          schema:
            type: string
            enum: [alert, instance]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VulnerabilityCorrelations'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - user lacks environment access, or the DAST-code correlation feature is not enabled for this tenant
          content:
            application/json:
              schema:
