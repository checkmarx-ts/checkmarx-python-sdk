  /changelog:
    post:
      description: Updates results metadata including severity, state, and notes
      operationId: updateChangelog
      requestBody:
        description: A structure containing the results to update and the new metadata
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - similarityID2
                - environment_id
                - scan_id
              properties:
                similarityID2:
                  type: array
                  description: Array of result IDs to update
                  maxItems: 1000
                  minItems: 1
                  items:
                    type: string
                    example: "79f91fc5-3779-4699-8cd2-9b466e72e799"
                  example: ["79f91fc5-3779-4699-8cd2-9b466e72e799", "466f0848-7e0b-47e8-abe1-b2f114ccb130"]
                environment_id:
                  type: string
                  description: The environment ID
                  example: "39e776e4-adfb-4fc7-a144-66c7237f5c7a"
                scan_id:
                  type: string
                  description: The scan ID
                  example: "39e776e4-adfb-4fc7-a144-66c7237f5c7a"
                severity:
                  type: string
                  description: New severity level (optional)
                  enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
                  example: "HIGH"
                state:
                  type: string
                  description: New state value (optional)
                  enum: ["To Verify", "Not Exploitable", "Propose Not Exploitable", "Urgent", "Confirmed"]
                  example: "To Verify"
                note:
                  type: string
                  description: Optional note to add to the changelog
                  maxLength: 1000
                  example: "Updated severity based on security review"
                type:
                  type: string
                  description: Type of changelog entry
                custom_state_id:
                  type: integer
                  description: Custom state ID
                alert_similarity_id:
                  type: string
                  description: Alert similarity ID
      responses:
        '200':
          description: Success - metadata updated successfully
        '400':
          description: Bad Request - validation error or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found - results not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
