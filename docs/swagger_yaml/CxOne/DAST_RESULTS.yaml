components:
  schemas:
    ResultsFilter:
      type: object
      additionalProperties: false
      properties:
        severity:
          type: string
          example: HIGH
        name:
          type: string
          example: SQL Injection
        method:
          type: string
          example: GET
        status:
          type: string
          example: New
        state:
          type: string
          example: To Verify
        url:
          type: string
          example: localhost
        path:
          type: string
          example: /api/v1
        owasp:
          type: string
          example: A1
        alert_similarity_id:
          type: string
        correlation_findings:
          type: string
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          example: "Error message"
          description: The message decribing the error
        code:
          type: integer
          example: 401
          description: The error code
    ResultSummarizedList:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ResultSummarized'
        total:
          type: integer
          example: "10"
        pages_number:
          description: The total number of pages
          type: integer
          example: "10"
    ResultSummarized:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          example: "a32b6565-67d4-4079-9d0e-97061d3b9f3f"
        status:
