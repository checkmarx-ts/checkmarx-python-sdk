          maxLength: 32
          pattern: '^WSTG-[A-Z]+-[0-9]+$'
          description: The WSTG test ID.
          example: "WSTG-ATHN-04"
        name:
          type: string
          maxLength: 200
          pattern: '^.*$'
          description: The test name. Omitted when the ID is not in the WSTG version the service was built with.
          example: "Bypassing Authentication Schema"
        url:
          type: string
          maxLength: 500
          pattern: '^https://owasp\.org/.*$'
          description: Link to the test in the WSTG. Omitted when the ID is not in the WSTG version the service was built with.
    PentestWstgCoverage:
      type: object
      additionalProperties: false
      required:
        - categories
        - tests
      properties:
        categories:
          type: array
          maxItems: 50
          description: Every WSTG category of the snapshot the service was built with, with zero counts when the scan did not touch it.
          items:
            $ref: '#/components/schemas/PentestWstgCategoryCoverage'
        tests:
          type: array
          maxItems: 500
          description: The tests the scan's plans or confirmed findings mention, in WSTG order, then IDs that are not in the snapshot.
          items:
            $ref: '#/components/schemas/PentestWstgTestCoverage'
    PentestWstgCategoryCoverage:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - total_tests
        - planned_tests
        - confirmed_tests
      properties:
        id:
          type: string
          maxLength: 32
          pattern: '^WSTG-[A-Z]+$'
          example: "WSTG-ATHN"
        name:
          type: string
          maxLength: 200
          pattern: '^.*$'
        total_tests:
          type: integer
          description: Number of tests of the category in the snapshot.
        planned_tests:
          type: integer
          description: Tests of the category that a plan of the scan exercised.
        confirmed_tests:
          type: integer
          description: Tests of the category that a confirmed plan or finding of the scan shows.
    PentestWstgTestCoverage:
      type: object
      additionalProperties: false
      required:
        - id
        - plans
        - confirmed_plans
        - confirmed_findings
      properties:
        id:
          type: string
          maxLength: 32
          pattern: '^WSTG-[A-Z]+-[0-9]+$'
          example: "WSTG-SESS-06"
        name:
          type: string
          maxLength: 200
          pattern: '^.*$'
          description: Omitted when the ID is not in the WSTG version the service was built with.
        url:
          type: string
          maxLength: 500
          pattern: '^https://owasp\.org/.*$'
          description: Omitted when the ID is not in the WSTG version the service was built with.
        category:
          type: string
          maxLength: 32
          pattern: '^WSTG-[A-Z]+$'
          description: Omitted when the ID is not in the WSTG version the service was built with.
        plans:
          type: integer
          description: Plans of the scan that exercised the test.
        confirmed_plans:
          type: integer
          description: Of those plans, the ones whose outcome was confirmed.
        confirmed_findings:
          type: integer
          description: Confirmed findings of the scan that show the test.
    StepAlertLink:
      type: object
      additionalProperties: false
      properties:
        alert_similarity_id:
          type: string
        relationship:
          type: string
    PentestFindingStepData:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
        url:
          type: string
        request_headers:
          type: string
        request_body:
          type: string
        response_headers:
          type: string
        response_body:
          type: string
        response_status:
          type: integer
        detail:
          type: string
    PentestFindingStep:
      type: object
      additionalProperties: false
      properties:
        step_number:
          type: integer
        title:
          type: string
        description:
          type: string
        type:
          type: string
        data:
          $ref: '#/components/schemas/PentestFindingStepData'
        related_alerts:
          type: array
          items:
            $ref: '#/components/schemas/StepAlertLink'
    PentestFindingDastInstance:
      type: object
      additionalProperties: false
      properties:
        alert_similarity_id:
          type: string
        instance_similarity_id:
          type: string
        connection_type:
          type: string
        alert:
          type: string
        severity:
          type: string
        url:
          type: string
        path:
          type: string
        method:
          type: string
    PentestFindingDetails:
      type: object
      additionalProperties: false
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PentestFindingStep'
        related_dast_instances:
          type: array
          items:
            $ref: '#/components/schemas/PentestFindingDastInstance'
  parameters:
    environmentIdPath:
      name: environment_id
      in: path
      description: The environment ID
      required: true
      schema:
        type: string
        format: uuid
        example: "c668cda7-ec6a-498c-8660-4b29be557280"
    scanIdInAlertPath:
      name: scan_id
      in: path
      description: The scan ID
      required: true
      schema:
        type: string
        format: uuid
        example: "5fea8569-563a-44cc-955b-5d5a2304f173"
    page:
      name: page
      in: query
      description: The page number to get results for
      required: true
      schema:
        type: integer
        example: 1
    perPage:
      name: per_page
      in: query
      description: The number of results per page
      required: true
      schema:
        type: integer
        example: 10
    sortBy:
      name: sort_by
      in: query
      description: An object of key values to sort columns by regular - (method:asc), url encoded - (method%3Aasc)
      required: false
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          example: "severity%3Adesc"
    search:
      name: search
      in: query
      description: The search query
      required: false
      schema:
        type: string
    alertLevelFilter:
      name: filter
      in: query
      description: columns to filter by and values
      required: false
      schema:
        $ref: '#/components/schemas/AlertLevelFilter'
  securitySchemes:
    Login:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /spec/cxauth.html
          scopes: {}
servers:
  - url: /api/dast/mfe-results
security:
  - Login: []
