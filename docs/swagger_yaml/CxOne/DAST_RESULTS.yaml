  "/results/environment/{environment_id}/{scan_id}/vulnerability_summary":
    get:
      description: Get comprehensive vulnerability summary for a specific environment and scan including severity breakdown, state breakdown, and compliance breakdown
      operationId: getVulnerabilitySummary
      parameters:
        - name: environment_id
          in: path
          description: The environment ID to get vulnerability summary for
          required: true
          schema:
            type: string
            format: uuid
            example: "c668cda7-ec6a-498c-8660-4b29be557280"
        - name: scan_id
          in: path
          description: The scan ID to get vulnerability summary for
          required: true
          schema:
            type: string
            format: uuid
            example: "5fea8569-563a-44cc-955b-5d5a2304f173"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VulnerabilitySummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - User does not have access to the environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found - Scan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  "/results/setting/alert_level_enabled":
    get:
      description: Checks whether alert-level grouping is enabled for the caller's tenant
      operationId: isAlertLevelEnabled
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  isEnabled:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  "/results/environment/{environment_id}/{scan_id}/alert_level":
    get:
      description: Gets results grouped by alert level (alert-similarity), with pagination, filtering, sorting, and search
      operationId: getAlertLevelResults
      parameters:
        - $ref: '#/components/parameters/environmentIdPath'
        - $ref: '#/components/parameters/scanIdInAlertPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/sortBy'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/alertLevelFilter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLevelResultList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      description: Same as GET, but accepts the filter/sort/search/group parameters in a JSON request body instead of query string
      operationId: postAlertLevelResults
      parameters:
        - $ref: '#/components/parameters/environmentIdPath'
        - $ref: '#/components/parameters/scanIdInAlertPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertLevelRequestBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLevelResultList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  "/overview/occurrences_over_time/{environment_id}":
    get:
      description: Gets new/recurrent occurrence counts over time for alert-level results in an environment
      operationId: getAlertLevelOccurrences
      parameters:
        - name: environment_id
          in: path
          description: The environment ID
          required: true
          schema:
            type: string
            format: uuid
            example: "c668cda7-ec6a-498c-8660-4b29be557280"
        - name: scan_id
          in: query
          description: Optional scan ID filter
          required: false
          schema:
            type: string
            format: uuid
        - name: start
          in: query
          description: Start of the time period (ISO8601/RFC3339)
          required: false
          schema:
            type: string
            format: date-time
            example: "2024-10-01T00:00:00Z"
        - name: end
          in: query
          description: End of the time period (ISO8601/RFC3339)
          required: false
          schema:
            type: string
            format: date-time
            example: "2024-11-01T00:00:00Z"
        - name: severity
          in: query
          description: Filter by severity (can specify multiple)
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
        - name: compliance
          in: query
          description: Filter by compliance type (can specify multiple)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: include_manual_results
          in: query
          description: Whether to include manual findings in the results
          required: false
          schema:
            type: boolean
            example: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLevelOccurrencesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
