  "/results/environment/{environment_id}/{scan_id}/full_scan_results":
    get:
      description: Returns all alerts and instances for a scan (used by the correlation wizard), including correlatedAt timestamps
      operationId: getFullScanResults
      parameters:
        - $ref: '#/components/parameters/environmentIdPath'
        - $ref: '#/components/parameters/scanIdInAlertPath'
      responses:
