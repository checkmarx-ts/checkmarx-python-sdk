openapi: 3.0.1
info:
  title: Scans Manager Service Frontend API
  description: API for the Scans Manager Service Frontend
  version: 1.0.0
tags:
  - name: scans-manager-service
paths:
  /tenant:
    get:
      summary: "Get the tenant dashboard information"
      description: "Get tenant dashboard information"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        "400":
          description: Bad request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /environments:
    get:
      summary: "Get all environments with their last scans"
      description: "Get all environments"
      parameters:
        - name: match
          in: query
          description: "Look for exact match of values in columns domain, url, scanType, projectId, lastRiskRating or environmentId"
          schema:
            $ref: '#/components/schemas/EnvironmentFilter'
        - name: filter
          description: "Look for a partial match of values in columns domain, url, scanType, projectId, lastRiskRating or environmentId"
          in: query
          schema:
            $ref: '#/components/schemas/EnvironmentFilter'
        - name: lastStatus
          in: query
          description: "Valid staus: New, ExternalScan, Running, Finished, Failed, Cancelled"
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: search
          in: query
          description: "Will search in columns: domain, url"
          schema:
            type: string
        - name: sort
          in: query
          description: "Valid columns: domain, url, scantype, lastscantime, lastscanstatus, lastriskrating"
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              example: "domain:asc"
        - name: tags
          in: query
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: groups
          in: query
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: from
          in: query
          schema:
            type: integer
        - name: to
          in: query
          schema:
            type: integer
        - name: scanTypes
          in: query
          description: "Filter by scan types"
          schema:
            type: array
            items:
              type: string
              enum: [DAST, DASTAPI, DASTMCP]
        - name: riskRatings
          in: query
          description: "Filter by risk ratings"
          schema:
            type: array
            items:
              type: string
              enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
        - name: alertRiskRatings
          in: query
          description: "Filter by alert risk ratings"
          schema:
            type: array
            items:
              type: string
              enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsResponse'
        "400":
          description: Bad request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /environment:
    post:
      summary: "Create a new environment"
      description: "Create a new environment"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - domain
                - url
                - scanType
              properties:
                domain:
                  type: string
                url:
                  type: string
                scanType:
                  type: string
                  enum: [DAST, DASTAPI, DASTMCP]
                  description: "Type of scan/environment. DASTMCP environments must have HasAuth set to false"
                isPublic:
                  type: boolean
                projectIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                groups:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                clientIds:
                  type: array
                  description: "Client IDs to assign to the environment"
                  items:
                    type: string
                userIds:
                  type: array
                  description: "User IDs to assign to the environment"
                  items:
                    type: string
                Settings:
                  $ref: '#/components/schemas/EnvSettings'
                HasAuth:
                  type: boolean
                  description: "Whether the environment has authentication configured. Must be false when scanType is 'DASTMCP'"
                appIds:
                  type: array
                  description: "Application IDs"
                  items:
                    type: string
                primaryAppIds:
                  type: array
                  description: "Primary application IDs"
                  items:
                    type: string
                source:
                  type: string
                  description: "Source of the environment"
            examples:
              "0":
                value: "{\n\t\"domain\":\"my-domain\",\n\n\t\"url\":\"http://local-domain\",\n\t\"scanType\":\"DAST\",\n\t\"isPublic\":true,\n\t\"projectIds\":[\"af281f72-83b2-4a53-ae26-12a32303456f\"],\n\t\"tags\":[\"A\", \"B\"],\n\t\"groups\":[\"C\", \"D\"]\n}"
      responses:
        "201":
          description: Created
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    put:
      summary: "Update an existing environment"
      description: "Update an existing environment"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - environmentID
              properties:
                environmentID:
                  type: string
                domain:
                  type: string
                url:
                  type: string
                scanType:
                  type: string
                  enum: [DAST, DASTAPI, DASTMCP]
                isPublic:
                  type: boolean
                projectIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                groups:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                clientIds:
                  type: array
                  description: "Client IDs to assign to the environment"
                  items:
                    type: string
                userIds:
                  type: array
                  description: "User IDs to assign to the environment"
                  items:
                    type: string
                Settings:
                  $ref: '#/components/schemas/EnvSettings'
                tunnelId:
                  type: string
                  description: "Tunnel ID"
                appIds:
                  type: array
                  description: "Application IDs"
                  items:
                    type: string
                primaryAppIds:
                  type: array
                  description: "Primary application IDs"
                  items:
                    type: string
            examples:
              "0":
                value: "{\n\t\"environmentID\":\"af281f72-83b2-4a53-ae26-12a32303456f\",\n\t\"domain\":\"my-domain\",\n\n\t\"url\":\"http://local-domain\",\n\t\"scanType\":\"DAST\",\n\t\"isPublic\":true,\n\t\"projectIds\":[\"af281f72-83b2-4a53-ae26-12a32303456f\"],\n\t\"tags\":[\"A\", \"B\"],\n\t\"groups\":[\"C\", \"D\"]\n}"
      responses:
        "200":
          description: OK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    delete:
      summary: "Delete an existing environment"
      description: "Delete an existing environment"
      parameters:
        - name: environmentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Environment not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /environment/{envId}:
    get:
      summary: "Fetch the environemt information"
      description: "Get environment information"
      parameters:
        - in: path
          required: true
          name: envId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvWithStatus'
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: No such environment was found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /environments/groups:
    get:
      summary: "Group environments by columns"
      description: "Group environments by columns"
      parameters:
        - name: groupBy
          in: query
          description: "Columns to group-by: domain, url, scanType, lastRiskRating, projectId"
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: filter
          in: query
          description: "Look for a partial match of values in columns Domain, URL, ScanType, LastRiskRating or environmentId"
          schema:
            type: object
            properties:
              domain:
                type: string
              url:
                type: string
              scanType:
                type: string
              projectId:
                type: string
              lastRiskRating:
                type: string
              environmentId:
                type: string
              authSuccess:
                type: string
              tunnelState:
                type: string
        - name: LastScanStatus
          in: query
          description: "Filter by last scan status"
          schema:
            type: array
            items:
              type: string
        - name: Search
          in: query
          description: "Search term"
          schema:
            type: string
        - name: Tags
          in: query
          description: "Filter by tags"
          schema:
            type: array
            items:
              type: string
        - name: Groups
          in: query
          description: "Filter by groups"
          schema:
            type: array
            items:
              type: string
        - name: RiskRatings
          in: query
          description: "Filter by risk ratings"
          schema:
            type: array
            items:
              type: string
        - name: AlertRiskRatings
          in: query
          description: "Filter by alert risk ratings"
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupItem'
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /scans:
    get:
      summary: "Fetch all scans for an environment"
      description: "Get all scans for an environment"
      parameters:
        - name: environmentID
          in: query
          required: true
          description: "Environment ID"
          schema:
            type: string
            format: uuid
        - name: match
          in: query
          description: "Look for an exact match of values in columns"
          schema:
            type: object
            properties:
              initiator:
                type: string
              scanType:
                type: string
              projectId:
                type: string
              riskRating:
                type: string
              scanId:
                type: string
        - name: filter
          in: query
          description: "Look for a partial match of values in columns"
          schema:
            type: object
            properties:
              initiator:
                type: string
              scanType:
                type: string
              projectId:
                type: string
              riskRating:
                type: string
              scanId:
                type: string
        - name: lastStatus
          in: query
          description: "Filter by scan status"
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          description: "Sort by columns"
          schema:
            type: array
            items:
              type: string
        - name: search
          in: query
          description: "Search term"
          schema:
            type: string
        - name: tags
          in: query
          description: "Filter by tags"
          schema:
            type: array
            items:
              type: string
        - name: groups
          in: query
          description: "Filter by groups"
          schema:
            type: array
            items:
              type: string
        - name: from
          in: query
          description: "Pagination start"
          schema:
            type: integer
        - name: to
          in: query
          description: "Pagination end"
          schema:
            type: integer
        - name: insightLevels
          in: query
          description: "Filter by insight levels"
          schema:
            type: array
            items:
              type: string
        - name: hasResults
          in: query
          description: "Filter by has results"
          schema:
            type: boolean
        - name: hasFailedSequences
          in: query
          description: "Filter by has failed sequences"
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScanWithStatus'
                  totalCount:
                    type: integer
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Environment not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /scans/groups:
    get:
      summary: "Group scans by columns"
      description: "Group scans by columns"
      parameters:
        - name: environmentID
          in: query
          required: true
          description: "Environment ID"
          schema:
            type: string
            format: uuid
        - name: groupBy
          in: query
          description: "Columns to group-by"
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: filter
          in: query
          description: "Look for a partial match of values in columns"
          schema:
            type: object
            properties:
              initiator:
                type: string
              scanType:
                type: string
              projectId:
                type: string
              riskRating:
                type: string
              scanId:
                type: string
        - name: ScanStatus
          in: query
          description: "Filter by scan status"
          schema:
            type: array
            items:
              type: string
        - name: Search
          in: query
          description: "Search term"
          schema:
            type: string
        - name: Tags
          in: query
          description: "Filter by tags"
          schema:
            type: array
            items:
              type: string
        - name: Groups
          in: query
          description: "Filter by groups"
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupItem'
        "400":
          description: Bad request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /scan:
    post:
      summary: "Create a new scan"
      description: "Create a new scan for an environment"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - environmentId
                - scanType
                - configurationFile
              properties:
                environmentId:
                  type: string
                  format: uuid
                scanType:
                  type: string
                  enum: [DAST, DASTAPI, DASTMCP]
                tags:
                  type: array
                  items:
                    type: string
                groups:
                  type: array
                  items:
                    type: string
                useExternalWorker:
                  type: boolean
                useAuthSession:
                  type: boolean
                apiFileType:
                  type: string
                cliVersion:
                  type: string
                heartbeatInterval:
                  type: integer
                initiator:
                  type: string
                configurationFile:
                  type: string
                  format: binary
                  description: "Configuration file for the scan"
                APIFile:
                  type: string
                  format: binary
                  description: "API specification file (OpenAPI, Postman, HAR)"
      responses:
        "201":
          description: Created
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Environment not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    put:
      summary: "Update a scan"
      description: "Update a scan"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environmentId
                - scanId
              properties:
                environmentId:
                  type: string
                  format: uuid
                scanId:
                  type: string
                  format: uuid
                tags:
                  type: array
                  items:
                    type: string
                groups:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Scan not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    patch:
      summary: "Cancel a scan"
      description: "Cancel a running scan"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environmentId
                - scanId
              properties:
                environmentId:
                  type: string
                  format: uuid
                scanId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: OK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Scan not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    delete:
      summary: "Delete a scan"
      description: "Delete a scan"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environmentId
                - scanId
              properties:
                environmentId:
                  type: string
                  format: uuid
                scanId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: OK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Scan not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /scan/{scanId}:
    get:
      summary: "Fetch a scan"
      description: "Get a scan by ID"
      parameters:
        - in: path
          required: true
          name: scanId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanWithStatus'
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Scan not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /log/{scanId}:
    get:
      summary: "Fetch scan logs"
      description: "Get logs for a scan"
      parameters:
        - in: path
          required: true
          name: scanId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Scan not found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /publicScan:
    post:
      summary: "Create a new public scan"
      description: "Post a new public scan"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - environmentID
              properties:
                environmentID:
                  type: string
            examples:
              "0":
                value: "{\n    \"environmentID\":\"af281f72-83b2-4a53-ae26-12a32303456f\"\n}"
      responses:
        "201":
          description: Created
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "af281f72-83b2-4a53-ae26-12a32303456f"
        "401":
          description: Unauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /externalScan:
    put:
      summary: "Update an external scan to finished/failed state"
      description: 'Update an external scan to finished/failed state, have no affect on scans that are not in "ExternalScan" status (including finished/failed external scans)'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - scanId
              properties:
                environmentId:
                  type: string
                scanId:
                  type: string
                startTime:
                  type: string
                updateTime:
                  type: string
                scanDuration:
                  type: number
                lastStatus:
                  type: string
                  description: "A message describing the scan state"
                  example: "Uploading results to ResultsService"
                log:
                  type: string
                  description: "String representation of the binary log file (plaintext)"
                statistics:
                  type: string
                  description: 'Determines if the scan was successful; Should contain "Finished" or "Failed"'
                zapError:
                  type: string
                zapExitStatus:
                  type: string
                errCode:
                  type: string
                errors:
                  type: array
                  items:
                    type: string
                hasResultsError:
                  type: boolean
                numLogFiles:
