openapi: 3.0.2
info:
  description: "CxAST Projects service REST API"
  version: 1.0.0
  title: "Projects Service"
paths:
  /:
    post:
      tags:
        - Projects
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
      requestBody:
        required: true
        content:
          application/json; version=1.0:
            schema:
              $ref: '#/components/schemas/projectInput'
            encoding:
              projects:
                contentType: application/json
      responses:
        '201':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/project'
          headers:
            Location:
              schema:
                type: string
              description: The URL to use when retrieving details about the created project
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    get:
      tags:
        - Projects
      summary: Get a list of projects
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
          description: The number of items to skip before starting to collect the result set
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 20
            example: 20
          description: The number of items to return
        - in: query
          name: ids
          schema:
            type: array
            items:
              type: string
          description: Project ids, filtered only by exact match.
        - in: query
          name: names
          schema:
            type: array
            items:
              type: string
          description: Project names, filtered only by exact match. Mutually exclusive to name and name-regex
        - in: query
          name: name
          schema:
            type: string
          description: Project name, can be filtered by partial name. Mutually exclusive to names and name-regex
        - in: query
          name: name-regex
          schema:
            type: string
          description: Project name, filtered by the regex given. Mutually exclusive to name and names
        - in: query
          name: groups
          schema:
            type: array
            items:
              type: string
          explode: false
          description: "Project groups. filter by the groups given. Searching exact match with an OR operation between them"
        - in: query
          name: origins
          schema:
            type: array
            items:
              type: string
          explode: false
          description: "Project origin. filter by the origins given. Searching exact match with an OR operation between them"
        - in: query
          name: tags-keys
          schema:
            type: array
            items:
              type: string
          explode: false
          description: Project tags, filter by the keys in the tags map (OR operation between the items)
        - in: query
          name: tags-values
          schema:
            type: array
            items:
              type: string
          explode: false
          description: Project tags, filter by the values in the tags map (OR operation between the items)
        - in: query
          name: empty-tags
          required: false
          schema:
            type: boolean
          description: Whether the project has tags or not
        - in: query
          name: repo-url
          schema:
            type: string
          description: Project repository url, filtered by the repo url given
        - in: query
          name: imported-projects
          required: false
          schema:
            type: boolean
          description: Whether the project was imported (true/false)
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/projectsCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /tags:
    get:
      tags:
        - Projects
      summary: Get all tags
      description: ""
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - in: query
          name: search
          schema:
            type: string
          description: Search text, filtered by partial match on tag key OR tag value.
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                type: object
                example:
                  "test": [""]
                  "priority": ["high", "low"]
                additionalProperties:
                  type: array
                  items:
                    type: string
                description: Project custom tags
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /tagsByFilters:
    get:
      tags:
        - Projects
      summary: Get tags with filtering and pagination
      description: "Get project tags with advanced filtering capabilities, and pagination support. Returns a paginated response with links and metadata."
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
          description: The number of items to skip before starting to collect the result set
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 20
            example: 20
          description: The number of items to return
        - in: query
          name: search
          schema:
            type: string
          description: Search text, filtered by partial match on tag key OR tag value.
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/tagsFilterResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          description: Internal server error
  /last-scan:
    get:
      tags:
        - Projects
      summary: Get a map of project-id to scan (smaller set of scan)
      description: Get a key-value map, key=[project id], value=[last scan (based on the filter)]
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
          description: The number of items to skip before starting to collect the result set
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 20
            example: 20
          description: The number of items to return
        - in: query
          name: project-ids
          schema:
            type: array
            items:
              type: string
          explode: false
          description: Project ids, filtered by exact match. Mutually exclusive with application-id
        - in: query
          name: application-id
          schema:
            type: string
          description: Application id, filtered by exact match. Mutually exclusive with project-ids.
        - in: query
          name: scan-status
          schema:
            type: string
          description: "Scan status, please look at the scans API description for status options"
        - in: query
          name: branch
          schema:
            type: string
          description: "Git branch of the scan"
        - in: query
          name: engine
          schema:
            type: string
          description: "Engine type of the scan"
        - in: query
          name: sast-status
          schema:
            type: string
          description: "Sast engine status, please look at the scans API description for status options"
        - in: query
          name: kics-status
          schema:
            type: string
          description: "Kics engine status, please look at the scans API description for status options"
        - in: query
          name: sca-status
          schema:
            type: string
          description: "Sca engine status, please look at the scans API description for status options"
        - in: query
          name: apisec-status
          schema:
            type: string
          description: "APISec engine status, please look at the scans API description for status options"
        - in: query
          name: microengines-status
          schema:
            type: string
          description: "Micro Engines engine status, please look at the scans API description for status options"
        - in: query
          name: containers-status
          schema:
            type: string
          description: "Containers engine status, please look at the scans API description for status options"
        - in: query
          name: use-main-branch
          description: |
            A boolean flag to determine if the response should prioritize scans from the main branch.
            - `true`: Return the last scan from the main branch if specified for the project, overriding the branch filter.
            - `false` (default): Return the last scan regardless of the branch.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/subsetScan'
                example:
                  project-id: {"id": "scan-id", "createdAt": "", "updatedAt": "", "status": "Completed", "userAgent": "user-agent", "initiator": "initiator", "branch": "branch", "engines": "[\"sast\", \"kics\"]", "sourceType": "github", "sourceOrigin": "Jenkins"}
                description: Map of project-id to scan, scan has limited properties.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /branches:
    get:
      tags:
        - Projects
      summary: Get a list of branches associated to this project sorted by date descented
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
          description: The number of items to skip before starting to collect the result set
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 20
            example: 20
          description: The number of items to return
        - in: query
          name: project-id
          schema:
            type: string
          description: Project id, filtered by exact match
        - in: query
          name: branch-name
          schema:
            type: string
          description: Branch name. filtered by full or partial name
      responses:
        '200':
          description: OK,
          content:
            application/json; version=1.0:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /{id}:
    get:
      tags:
        - Projects
      summary: Get a project
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: 'OK'
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/richProject'
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    put:
      tags:
        - Projects
      summary: Update a project
      description: "Update Project. All parameters are overwritten by the new configuration, even parameters that aren't submitted in the update body. For example, if you had assigned tags to a project and you update the project without submitting the tags parameter, all existing tags will be deleted."
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json; version=1.0:
            schema:
              $ref: '#/components/schemas/projectUpdate'
            encoding:
              projects:
                contentType: application/json
      responses:
        '204':
          description: No Content
          headers:
            Location:
              schema:
                type: string
              description: The URL to use when retrieving details about the updated project
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: ""
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    patch:
      tags:
        - Projects
      summary: Update a project fields
      description: "Change or add project details by re-submitting only those fields you wish to edit. \nParameters that you don't submit will remain unchanged. \nThe request body can include one or all of the fields documented below in the Body section.\n\nIMPORTANT  \nIf you submit new values for groups or tags, these will not replace the existing items, \nbut rather append new items in addition to the existing ones. \nHowever, specifically for groups, if you submit an empty array this will delete all existing groups. \nIn order to delete existing tags, use the Update a project endpoint.\n"
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json; version=1.0:
            schema:
              $ref: '#/components/schemas/projectUpdateFields'
            encoding:
              projects:
                contentType: application/json
      responses:
        '204':
          description: No Content
          headers:
            Location:
              schema:
                type: string
              description: The URL to use when retrieving details about the updated project
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /app/{id}:
    get:
      tags:
        - Projects
      summary: Get projects for a specific application
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - name: id
          in: path
          description: Application Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/projectsCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /schedules:
    get:
      tags:
        - Projects
      summary: Get scheduled scans with filtering and pagination
      description: "Get  scheduled scans with advanced filtering capabilities, and pagination support. Returns a paginated response with links and metadata."
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
          description: "The number of items to skip before starting to collect the result set."
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 20
            example: 20
          description: "The number of items to return."
        - in: query
          name: search
          schema:
            type: string
          description: "Search text, filtered by partial match on schedule name."
        - in: query
          name: name
          schema:
            type: string
          description: "Schedule name, can be filtered by partial name. Mutually exclusive to names and name-regex."
        - in: query
          name: active
          schema:
            type: boolean
          description: "Whether the schedule is active or not."
        - in: query
          name: frequency
          schema:
            type: array
            items:
              type: string
          explode: false
          description: "Schedule frequencies. filter by the frequencies given. Searching exact match with an OR operation between them."
        - in: query
          name: from-creation-date
          schema:
            type: string
            format: date-time
          explode: false
          description: "Filter for the earliest date and time of a created schedule for which you would like to show results. Time must be entered in RFC3339 Date (Extend) format (e.g. 2021-06-02T12:14:18.028555Z)"
        - in: query
          name: to-creation-date
          schema:
            type: string
            format: date-time
          description: "Filter for the latest date and time of a created schedule for which you would like to show results. Time must be entered in RFC3339 Date (Extend) format (e.g. 2021-06-02T12:14:18.028555Z)"
        - in: query
          name: from-trigger-date
          schema:
            type: string
            format: date-time
          explode: false
          description: "Filter for the earliest date and time of a triggered schedule for which you would like to show results. Time must be entered in RFC3339 Date (Extend) format (e.g. 2021-06-02T12:14:18.028555Z)"
        - in: query
          name: to-trigger-date
          schema:
            type: string
            format: date-time
          description: "Filter for the latest date and time of a triggered schedule for which you would like to show results. Time must be entered in RFC3339 Date (Extend) format (e.g. 2021-06-02T12:14:18.028555Z)"
        - in: query
          name: sort
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum: [-created_at, +created_at, -status, +status, +name, -name, +trigger_time, -trigger_time]
            default:
              - +created_at
              - +status
            description: "Sort results by the specified parameter. Enter '+/-' for ascending/descending order, followed by the parameter."
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/getSchedulesResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /schedules/{id}:
    get:
      tags:
        - Projects
      summary: Get scheduling by project ID (resource ID)
      description: Get scheduler scan by project id
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/getScheduledScanResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
    delete:
      tags:
        - Projects
      summary: Delete a scheduled scan for project
      description: Delete scheduler scan by project id
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json; version=1.0:
              schema:
                properties:
                  message:
                    type: string
                  code:
                    type: integer
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
    post:
      tags:
        - Projects
      summary: Create scheduled scan for this project
      description: Create scheduler by project id.
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json; version=1.0:
            schema:
              $ref: '#/components/schemas/createScheduledScanRequest'
            encoding:
              projects:
                contentType: application/json
      responses:
        '201':
          description: Created
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/createScheduledScanResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
    patch:
      tags:
        - Projects
      summary: Update scheduled scan for this project
      description: Update scheduled scan settings for a project (only send the parameters that should be updated)
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/versionHeader'
        - $ref: '#/components/parameters/correlationIdHeader'
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json; version=1.0:
            schema:
              allOf:
                - $ref: '#/components/schemas/updateScheduledScanRequest'
                - type: object
                  properties:
                    active:
                      type: boolean
            encoding:
              projects:
                contentType: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json; version=1.0:
              schema:
                properties:
                  message:
                    type: string
                  code:
                    type: integer
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /reassign/{id}:
    put:
      summary: Reassign project to different applications
      description: Reassign a project from a list of source applications to a list of destination applications.
      operationId: reassignProject
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the project to be reassigned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationIdsToDisassociate:
                  type: array
                  items:
                    type: string
                  description: List of source application IDs
                applicationIdsToAssociate:
                  type: array
                  items:
                    type: string
                  description: List of destination application IDs
              required:
                - applicationIdsToDisassociate
                - applicationIdsToAssociate
      responses:
        '204':
          description: Project reassigned successfully, no content returned
        '400':
          description: Bad request – invalid input or validation failure
        '403':
          description: Forbidden – user not authorized to perform this action
        '404':
          description: Not found – project or applications not found
        '500':
          description: Internal server error
components:
  schemas:
    project:
      properties:
        id:
          type: string
          description: "A unique identifier for a project"
        name:
          type: string
          description: "The project name"
        groups:
          type: array
          description: The groups authorized for this project
          items:
            type: string
        repoUrl:
          type: string
          description: The reprosentive repository URL
        mainBranch:
          type: string
          description: The Git main branch
        origin:
          type: string
          description: The origin of project
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tags:
          type: object
          example:
            "test": ""
            "priority": "high"
          additionalProperties:
            type: string
          description: Project tags
        criticality:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          example: 3
          description: Criticality level of the project
    richProject:
      properties:
        id:
          type: string
          description: "A unique identifier for a project"
        name:
          type: string
          description: "The project name"
        applicationIds:
          type: array
          description: The applications this project is associated to
          items:
            type: string
        groups:
          type: array
          description: The groups authorized for this project
          items:
            type: string
        repoUrl:
          type: string
          description: The reprosentive repository URL
        mainBranch:
          type: string
          description: The Git main branch
        origin:
          type: string
          description: The origin of project
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tags:
          type: object
          example:
            "test": ""
            "priority": "high"
          additionalProperties:
            type: string
          description: Project tags
        criticality:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          example: 3
