    getSchedulesResponse:
      type: array
      description: "Get a list of scheduled scans"
      properties:
        schedules:
          $ref: '#/components/schemas/getScheduledScansResponse'
        totalCount:
          $ref: '#/components/schemas/totalCountResponse'
        totalFilteredCount:
          $ref: '#/components/schemas/totalFilteredCountResponse'
      example:
        schedules:
          - id: "abc123"
            projectID: "proj123"
            name: "schedule name"
            start_time: "14:00"
            created_at: "2021-01-01T00:00:00Z"
            updated_at: "2021-01-01T00:00:00Z"
            frequency: "weekly"
            days: ["Monday"]
            active: true
            branch: "main"
            engines: ["SAST"]
            tags:
              "priority": "high"
            trigger_time: "2021-01-01T14:00:00Z"
            project_name: "MyProject"
        totalCount: 1
        totalFilteredCount: 1
    updateScheduledScanRequest:
      properties:
        name:
          type: string
          description: "Scheduled scan's name"
        start_time:
          $ref: '#/components/schemas/time'
        frequency:
          $ref: '#/components/schemas/frequency'
        days:
          $ref: '#/components/schemas/days'
        engines:
          $ref: '#/components/schemas/engines'
        branch:
          type: string
          description: "Specific git branch"
        tags:
          $ref: '#/components/schemas/tags'
        new_project_id:
          type: string
          description: "New project id that should be associated to this schedule"
      anyOf:
        - properties:
            frequency:
              type: string
              enum:
                - weekly
            days:
              required: [days]
              description: "For weekly scans, 'days' is required."
          required: [days]
    error:
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: integer
    time:
      type: string
      example: "14:00"
      pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$"
      description: "Specifies the time at which the scheduled scan will be triggered. The time must be provided in GMT and follow the 24-hour format (e.g., 14:00 for 2 PM)."
    frequency:
      type: string
      enum:
        - daily
        - weekly
      description: |
        Specifies the frequency of scan execution.
        - daily: The scan runs every day of the week (7 days).
        - weekly: The scan runs on specified days of the week. Use this option to select specific days.
    days:
      type: array
      items:
        type: string
        enum:
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          - Sunday
      description: |
        Specifies the days of the week for the scan if the frequency is set to "weekly".
      minItems: 1
    engines:
      type: array
      items:
        type: string
        enum:
          - SCA
          - SAST
          - KICS
      description: |
        Specifies scan engine type
      minItems: 1
    tags:
      type: object
      additionalProperties:
        type: string
      example:
        "priority": "high"
      description: |
        - Add tag to all scans that triggered by specific scheduler
        - all tags will be replaced on update
    tagsFilterResponse:
      properties:
        _links:
          $ref: '#/components/schemas/_linksResponse'
        totalCount:
          $ref: '#/components/schemas/totalCountResponse'
        totalFilteredCount:
          $ref: '#/components/schemas/totalFilteredCountResponse'
        items:
          type: object
          example:
            "test": [""]
            "priority": ["high", "low"]
          additionalProperties:
            type: array
            items:
              type: string
          description: Project custom tags
  responses:
    '401':
      description: "Unauthorized, Access token is missing or invalid"
    '403':
      description: "Forbidden"
    '404':
      description: Not Found
      content:
        application/json; version=1.0:
          schema:
            $ref: '#/components/schemas/error'
    '400':
      description: Bad Request
      content:
        application/json; version=1.0:
          schema:
            $ref: '#/components/schemas/error'
  parameters:
    authHeader:
      in: header
      name: Authorization
      description: "REQUIRED: JWT authorization token"
      schema:
        type: string
        format: JWT
    correlationIdHeader:
      in: header
      name: CorrelationId
      required: false
      description: "correlation id to keep track of a flow if many APIs are involved"
      schema:
        type: string
        format: uuid
    versionHeader:
      in: header
      name: Accept
      required: false
      description: "API version should be appended to this header"
      schema:
        type: string
        example: "*/*; version=1.0"
        pattern: .*version\s*=\s*([\d|.]+)
    pathId:
      name: id
      in: path
      description: Project Id
      required: true
      schema:
        type: string
  securitySchemes:
    Login:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /spec/cxauth.html
          scopes: {}
servers:
  - url: /api/projects
security:
  - Login: []
