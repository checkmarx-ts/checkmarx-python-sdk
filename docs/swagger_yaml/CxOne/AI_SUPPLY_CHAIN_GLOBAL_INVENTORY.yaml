openapi: 3.1.0
info:
  description: "AI Supply Results Service REST API  - Global Inventory"
  title: "AI Supply Results Service - Global Inventory"
  version: 1.0.0
paths:
  "/results":
    get:
      tags:
        - Results
      summary: Get a list of all results for a specific tenant
      operationId: GetResults
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
        - $ref: "#/components/parameters/projectIdsParam"
        - $ref: "#/components/parameters/assetNamesParam"
        - $ref: "#/components/parameters/providersParam"
        - $ref: "#/components/parameters/searchParam"
        - $ref: "#/components/parameters/assetTypeIdsParam"
        - $ref: "#/components/parameters/applicationIdsParam"
        - $ref: "#/components/parameters/orderColumnParam"
        - $ref: "#/components/parameters/orderDirectionParam"
        - $ref: "#/components/parameters/statusesParam"
        - $ref: "#/components/parameters/assetStatusParam"
        - $ref: "#/components/parameters/evidenceStatusParam"
        - $ref: "#/components/parameters/includeEvidenceParam"
        - $ref: "#/components/parameters/riskSeveritiesParam"
      responses:
        "200":
          description: Ok
          content:
            application/json; version=1.0:
              schema:
                $ref: "#/components/schemas/paginatedResultsListResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
  "/results/aggregate":
    get:
      tags:
        - Results
      summary: Aggregate results groups by specified fields
      operationId: AggregateResultsGroups
      parameters:
        - $ref: "#/components/parameters/projectIdsParam"
        - $ref: "#/components/parameters/assetNamesParam"
        - $ref: "#/components/parameters/providersParam"
        - $ref: "#/components/parameters/searchParam"
        - $ref: "#/components/parameters/assetTypeIdsParam"
        - $ref: "#/components/parameters/applicationIdsParam"
        - $ref: "#/components/parameters/groupByParam"
        - $ref: "#/components/parameters/statusesParam"
      responses:
        "200":
          description: Ok
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/groupsAggregation'
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
  "/result/{id}":
    get:
      tags:
        - Results
      summary: Get a specific result by id
      operationId: GetResultByID
      parameters:
        - $ref: "#/components/parameters/resultIdParam"
      responses:
        "200":
          description: Ok
          content:
            application/json; version=1.0:
              schema:
                $ref: "#/components/schemas/resultWithEvidences"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
components:
  schemas:
    paginatedResultsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/result"
          description: list of returned objects
        total:
          type: integer
          description: total
        currentPage:
          type: integer
          description: currentPage
        lastPage:
          type: integer
          description: currentPage
    resultTriage:
      type: object
      properties:
        evidence:
          $ref: '#/components/schemas/evidenceTriage'
        asset:
          $ref: '#/components/schemas/assetTriage'
    evidenceTriage:
      type: object
      properties:
        status:
          type: string
        scope:
          type: string
        snoozeEndDate:
          type: string
          format: date-time
    assetTriage:
      type: object
      properties:
        status:
          type: string
        scope:
          type: string
        snoozeEndDate:
          type: string
          format: date-time
        isSuppressed:
          type: boolean
    riskSummary:
      type: object
      properties:
        assetId:
          type: string
          format: uuid4
        totalRisks:
          type: integer
        riskCountBySeverity:
          type: object
          additionalProperties:
            type: integer
          description: keys are CRITICAL/HIGH/MEDIUM/LOW, present only when count > 0
    result:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for a result
        asset_id:
          type: string
          format: uuid4
          description: The asset id that identifies the type of the result
        project_id:
          type: string
          format: uuid4
          description: The project id where the result was found
        tenant_id:
          type: string
          format: uuid4
          description: The tenant id where the result belongs to
        status:
          type: string
          description: Triage display status for this asset in this project
          enum: [Monitored, Muted, Snoozed, Mixed]
        snooze_end_date:
          type: string
          format: date-time
          description: When the snooze expires; only set when status is Snoozed
        triage:
          $ref: '#/components/schemas/resultTriage'
        riskSummary:
          $ref: '#/components/schemas/riskSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        asset:
          $ref: '#/components/schemas/asset'
        project:
          $ref: '#/components/schemas/project'
    resultWithEvidences:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for a result
        asset_id:
          type: string
          format: uuid4
          description: The asset id that identifies the type of the result
        project_id:
          type: string
          format: uuid4
          description: The project id where the result was found
        tenant_id:
          type: string
          format: uuid4
          description: The tenant id where the result belongs to
        status:
          type: string
          description: Triage display status for this asset in this project
          enum: [Monitored, Muted, Snoozed, Mixed]
        snooze_end_date:
          type: string
          format: date-time
          description: When the snooze expires; only set when status is Snoozed
        triage:
          $ref: '#/components/schemas/resultTriage'
        riskSummary:
          $ref: '#/components/schemas/riskSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        asset:
          $ref: '#/components/schemas/asset'
        project:
          $ref: '#/components/schemas/project'
        mcpMetadata:
          $ref: '#/components/schemas/mcpMetadata'
        skillMetadata:
          $ref: '#/components/schemas/skillMetadata'
        evidences:
          type: array
          items:
            $ref: "#/components/schemas/evidence"
          description: list of evidences
    mcpMetadata:
      type: object
      description: >
        MCP-specific fields, returned for MCP server/client findings (asset.asset_type.display_format "MCP Server" or "MCP Client"). Values are merged across the result's evidences: a field keeps its value when every evidence reports it identically, and is "Mixed" when the evidences disagree or only some of them report it.

      properties:
        transport:
          type: string
          nullable: true
          description: stdio, SSE, or Streamable HTTP. "Mixed" when the evidences disagree.
        sourceType:
          type: string
          nullable: true
          description: >
            Engine-internal category for how the asset was resolved (e.g. package/docker/url). "Mixed" when the evidences disagree.

    skillMetadata:
      type: object
      description: >
        Skill-specific fields, returned for Skill findings (asset.asset_type.display_format "Skill"). Currently sourced from engine-reported skill frontmatter metadata (raw string values, e.g. "true"/"false" for the boolean-shaped fields). Values are merged across the result's evidences: a field keeps its value when every evidence reports it identically, and is "Mixed" when the evidences disagree or only some of them report it.

      properties:
        allowedTools:
          type: string
          nullable: true
          description: >
            Comma-separated list of tools the skill is allowed to invoke. "Mixed" when the evidences disagree.

        disableModelInvocation:
          type: string
          nullable: true
        userInvocable:
          type: string
          nullable: true
        frontmatterDescription:
          type: string
          nullable: true
          description: >
            The skill's own description, from its SKILL.md frontmatter. "Mixed" when the evidences disagree.

        frontmatterVersion:
          type: string
          nullable: true
          description: >
            The skill's own version, from its SKILL.md frontmatter. "Mixed" when the evidences disagree.

        lockFile:
          type: string
          nullable: true
          description: >
            Lockfile kind that manages the skill ("microsoft/apm" or "vercel-labs/skills"), when one does. "Mixed" when the evidences disagree, e.g. only some copies of the skill are claimed by a lockfile.

    evidence:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for the evidence
        evidence_path:
          type: string
          description: The evidence path
        evidence_line_start:
          type: integer
          description: The evidence line start
        evidence_line_end:
          type: integer
          description: The evidence line end
        evidence_column_start:
          type: integer
          description: The evidence column start
        evidence_column_end:
          type: integer
          description: The evidence column end
        evidence_type:
          type: string
          description: The type of the evidence
        evidence_key:
          type: string
          description: Stable content-based identity for the evidence, set by the owning analyzer
        result_id:
          type: string
          format: uuid4
          description: A unique identifier for the result id where the evidence relates to
        created_at:
          type: string
          format: date-time
    asset:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for the asset
        asset_identifier:
          type: string
          description: The asset identifier
        asset_name:
          type: string
          description: The asset name
        asset_type_id:
          type: string
          format: uuid4
          description: A unique identifier for the asset type
        asset_url:
          type: string
          description: The asset url
        provider:
          type: string
          description: The asset provider
        license:
          type: string
          description: The asset license
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        asset_type:
          $ref: '#/components/schemas/asset_type'
    asset_type:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for the asset type
        display_format:
          type: string
          description: >
            The asset type display format, passed through from the discovery engine. Known values: "AI Model", "AI SDK", "AI Library", "MCP Server", "MCP Client", "AI Agent", "AI Orchestration Framework", "Skill". Not an enum: new values can appear without a contract change.

          example: "MCP Server"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    project:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for the project
        name:
          type: string
          description: The project name
        scan_id:
          type: string
          format: uuid4
          description: The scan id associated with the project
        scan_date:
          type: string
          format: date-time
          description: The date of the scan associated with the project
        tenant_id:
          type: string
          format: uuid4
          description: The tenant id where the project belongs to
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        applications:
          type: array
          items:
            $ref: "#/components/schemas/application"
          description: list of applications associated with the project
    application:
      type: object
      properties:
        id:
          type: string
          format: uuid4
          description: A unique identifier for the application
        name:
          type: string
          description: The application name
        tenant_id:
          type: string
          format: uuid4
          description: The tenant id where the application belongs to
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    error:
      type: object
      properties:
        message:
          type: string
    groupsAggregation:
      type: object
      properties:
        groupsCounter:
          type: array
          items:
            type: object
            properties:
              assetTypeName:
                type: string
                description: The asset type display name.
              assetTypeId:
                type: string
                format: uuid4
                description: The asset type ID.
              projectName:
                type: string
                description: The project name.
                example: My AI Project
              projectId:
                type: string
                format: uuid4
                description: The project ID.
              applicationName:
                type: string
                description: The application name.
                example: AI App
              applicationId:
                type: string
                format: uuid4
                description: The application ID.
              assetId:
                type: string
                format: uuid4
                description: The asset ID.
              assetName:
                type: string
                description: The asset name.
              provider:
                type: string
                description: The asset provider.
              count:
                type: integer
                description: The count for the field value.
          description: An array of field counters.
  responses:
    "401":
      description: "Unauthorized, Access token is missing or invalid"
    "403":
      description: "Forbidden"
    "500":
      description: "Internal server error"
    "404":
      description: Not Found
      content:
        application/json; version=1.0:
          schema:
            $ref: "#/components/schemas/error"
    "400":
      description: Bad Request
      content:
        application/json; version=1.0:
          schema:
            $ref: "#/components/schemas/error"
  parameters:
    projectIdsParam:
      name: project-ids
      in: query
      description: Comma-separated list of project IDs to filter by
      required: false
      schema:
        type: string
        example: "123e4567-e89b-12d3-a456-426614174000,223e4567-e89b-12d3-a456-426614174001"
    providersParam:
      name: providers
      in: query
      description: Comma-separated list of providers to filter by
      required: false
      schema:
        type: string
        example: "openai,huggingface"
    assetNamesParam:
      name: asset-names
      in: query
      description: Comma-separated list of asset names to filter by
      required: false
      schema:
        type: string
        example: "gpt-4,claude-3"
    assetTypeIdsParam:
      name: asset-type-ids
      in: query
      description: Comma-separated list of asset type IDs to filter by
      required: false
      schema:
        type: string
        example: "123e4567-e89b-12d3-a456-426614174000,223e4567-e89b-12d3-a456-426614174001"
    searchParam:
      name: search
      in: query
      required: false
      schema:
        type: string
    limitParam:
      name: limit
      in: query
      description: limit the number of results
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    offsetParam:
      name: offset
      in: query
      description: offset the results
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    resultIdParam:
      name: id
      in: path
      description: Result ID
      required: true
      schema:
        type: string
        format: uuid4
    applicationIdsParam:
      name: application-ids
      in: query
      description: Comma-separated list of application IDs to filter by
      required: false
      schema:
        type: string
        example: "123e4567-e89b-12d3-a456-426614174000,223e4567-e89b-12d3-a456-426614174001"
    groupByParam:
      name: group-by
      in: query
      description: Fields to group by (e.g., assetType, projectName, applicationName)
      required: true
      schema:
        type: string
        enum:
          - assetType
          - projectName
          - applicationName
          - assetName
          - provider
    orderColumnParam:
      name: order-column
      in: query
      description: Column to sort by
      required: false
      schema:
        type: string
        enum:
          - created-at
          - updated-at
          - scan-date
          - project-name
          - asset-name
          - risk-severity
        default: created-at
    orderDirectionParam:
      name: order-direction
      in: query
      description: Sort direction
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
          - ASC
          - DESC
        default: desc
    includeEvidenceParam:
      name: include-evidences
      in: query
      description: Whether to include evidence details in the response
      required: false
      schema:
        type: boolean
        default: false
    assetStatusParam:
      name: asset-status
      in: query
      description: Comma-separated list of asset-level triage statuses to filter by (alias of statuses)
      required: false
      schema:
        type: string
        example: "Monitored,Muted,Snoozed,Mixed"
    evidenceStatusParam:
      name: evidence-status
      in: query
      description: Comma-separated list of evidence-level triage statuses to filter enriched rows by
      required: false
      schema:
        type: string
        example: "Monitored,Muted,Snoozed,Mixed"
    statusesParam:
      name: statuses
      in: query
      description: Comma-separated list of triage statuses to filter by (Monitored, Muted, Snoozed, Mixed)
      required: false
      schema:
        type: string
        example: "Monitored,Muted,Snoozed,Mixed"
    riskSeveritiesParam:
      name: risk-severities
      in: query
      description: Comma-separated list of risk severities to filter by (CRITICAL, HIGH, MEDIUM, LOW)
      required: false
      schema:
        type: string
        example: "CRITICAL,HIGH"
  securitySchemes:
    Login:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /spec/cxauth.html
          scopes: {}
servers:
  - url: /api/ai-sc/global-inventory
security:
  - Login: []
