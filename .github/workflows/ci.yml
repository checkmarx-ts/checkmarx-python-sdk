name: CI Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_INDEX_URL: https://:${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}@pypi.echohq.com/simple

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-build:
    runs-on: cx-public-ubuntu-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Package
        run: |
          pip install --upgrade pip build
          python -m build

  execute-pylint:
    runs-on: cx-public-ubuntu-x64
    strategy:
      max-parallel: 3
      matrix:
        pver:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '${{ matrix.pver }}'

      - name: Install packages
        shell: bash
        run: |
          pip install --upgrade pip
          pip install . pylint
  
      - name: Pylint
        shell: bash
        run: |
          pylint --disable=all --enable=E,F --disable=E1121 --score=false CheckmarxPythonSDK
