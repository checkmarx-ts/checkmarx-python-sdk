name: Upload Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write


jobs:
  deploy:

    runs-on: cx-public-ubuntu-x64

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        pip config set global.index-url https://:${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}@pypi.echohq.com/simple
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Package
      run: |
        pip install --upgrade pip build
        python -m build
    - name: Publish to PyPI
      uses: step-security/gh-action-pypi-publish@ef63b3f651e4131083ceb916595ce721a1959385 # v1.14.0
      with:
          user: __token__
          password: ${{ secrets.Checkmarx_Python_SDK_PYPI_PASSWORD }}
          attestations: false
          verbose: true
    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}  # built-in, no secret needed
      run: >-
        gh release create ${{ github.ref_name }} ${{ github.workspace }}/dist/* --generate-notes --title "Version ${{ github.ref_name }}"
